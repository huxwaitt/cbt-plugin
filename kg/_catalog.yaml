  id: panic-and-phobias.pitfall-exposure-stopped-before-the-test
  title: Exposure Stopped Before the Prediction Is Tested
  type: pitfall
  summary: Exposure tasks are cut short at peak fear, kept too easy, or ended once anxiety dips, so the feared outcome is never tested and avoidance returns.
  depth: L2
  stage: [treatment]
  topics: [panic, agoraphobia, specific-phobia, exposure, behavioral-experiments]
  concepts: [bh.escape, mp.avoidance-cycle, iv.exposure-therapy, iv.exposure-hierarchy, iv.inhibitory-learning-strategies, iv.behavioral-experiment]
  applies_when: Exposure is happening but progress stalls, the client leaves tasks at peak fear, the hierarchy stays at the bottom, or gains do not last.
  not_for: For exposure design in general read `behavioral.exposure-principles`; for safety behaviors during exposure read `panic-and-phobias.pitfall-hidden-safety-behaviors`.
